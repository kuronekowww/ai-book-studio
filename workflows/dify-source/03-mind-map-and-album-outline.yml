          role: system
          text: '# 角色

            你是一位书籍解读有声内容创作者，你需要分析书籍的内容性质，设计书籍解读的专辑目录大纲。


            ## 需要解读的书籍

            书名：{{#1748158370247.booktitle#}}

            作者：{{#1748158370247.author#}}


            # 技能

            熟悉书籍解读类专辑的组稿逻辑

            熟悉金字塔结构的信息分类方法


            # Audience

            在此前没有阅读过该书籍，将通过听书的方式获取本书内容的人


            # Style

            循序渐进，通俗易懂，保留原书精华

            '
        - id: 2355cd05-9629-4073-8d1c-952adfeda972
          role: user
          text: "# 拆书稿\n{{#1751621954595.result#}}\n\n# 你的任务\n为这本书籍设计一个书籍解读的有声专辑目录，包含每条声音的主题，主要观点，声音内容类型（解读/过渡），参考输出示例，将专辑大纲输出在文本框内。\n\
            \n## 内容要求\n1. 基于拆书稿中的知识模块，将书籍内容按主题划分成专辑中的声音小节（30条声音以上），优先参考拆书稿的叙述顺序，每条声音交付原书中一个子主题的内容量。\n\
            2. 专辑声音的内容顺序参考思维导图中的叙述顺序，专辑声音内容类型会存在“解读类”和“过渡类”两种类型：\n1. 对于叙事类的书籍，声音类型仅存在“解读类”；2.\
            \ 对于非叙事类的书籍，在两个大的知识模块之间可以增加一条过渡声音，对内容做承上启下，需要标明过渡的前后两节。\n3. 需要生成的是书籍主要内容的解读部分，避免生成单独的导入或尾声声音。\n\
            4. 每个content_index对应一条声音，避免拆分小节到多条声音内\n5. 声音标题的设计需要有趣吸睛，吸引听众点击\n\n## 格式要求\n\
            1. 理解专辑大纲中每一集声音的内容，遵循输出格式，在\"title\"中记录声音标题，\"main_points\"中记录声音的主要观点，\"\
            section_identifier\": 记录声音观点的来源（content_index），\"content_type\"中记录这条声音的类型是解读类还是过渡类。\n\
            2. 参考拆书稿，在每条声音的“section_identifier”中标注声音的主要观点内容出处，**明确对应拆书稿中的完整原书内容索引（content_index）**，便于后续检索原文，过渡声音的“section_identifier”应包含需要过渡的前后两个小节的原书内容索引（content_index）用逗号分开。\n\
            \n# 输出格式\n```text\n{\n  \"album_outline\": [\n    {\n      \"title\":\
            \ \"声音标题\",\n      \"main_points\": \"1. 主要观点 2. 主要观点 ...\",\n      \"\
            section_identifier\": \"content_index\",\n      \"content_type\": \"解读类/过渡类\"\
            \n    }\n  ]\n}\n```"
        retry_config:
          max_retries: 1
          retry_enabled: true
          retry_interval: 1000
        selected: true
        structured_output_enabled: true
        title: 专辑大纲
        type: llm
        variables: []
        vision:
          enabled: false
