    - data:
        code: "import json\nimport re\n\ndef main(text: str):\n    # 1. 优先匹配 ```text\
          \ 代码块\n    pattern_text = re.compile(r'```text(.*?)```', re.DOTALL)\n  \
          \  match = pattern_text.search(text)\n\n    # 2. 如果没找到，再匹配 ```json 代码块\n\
          \    if not match:\n        pattern_json = re.compile(r'```json(.*?)```',\
          \ re.DOTALL)\n        match = pattern_json.search(text)\n\n    # 3. 都没找到\
          \ → 返回错误\n    if not match:\n        return {\"error\": \"未找到 ```text 或\
          \ ```json 代码块\"}\n\n    # 提取内容\n    content = match.group(1).strip()\n\n\
          \    # 删除 <think>...</think> 标签及其内容\n    content = re.sub(r'<think>.*?</think>',\
          \ '', content, flags=re.DOTALL).strip()\n\n    try:\n        # 尝试解析为 JSON\
          \ 并格式化\n        json_obj = json.loads(content)\n        formatted_json =\
          \ json.dumps(json_obj, indent=2, ensure_ascii=False)\n        return {\"\
          result\": formatted_json}\n    except json.JSONDecodeError:\n        # 不是合法\
          \ JSON 就返回原文\n        return {\"result\": content}\n"
        code_language: python3
