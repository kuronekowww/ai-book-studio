    - data:
        code: "import json\n\ndef main(data: str) -> dict:\n    \"\"\"\n    提取并合并拆书稿中的主要观点和事件，适配两种格式（含main_viewpoints或events）\n\
          \    \n    Args:\n        data (str): 输入的JSON字符串数据\n\n    Returns:\n   \
          \     str: 包含章节、子主题、观点和事件的转换后JSON字符串\n    \"\"\"\n    # 解析输入JSON\n    try:\n\
          \        parsed_data = json.loads(data)\n    except json.JSONDecodeError:\n\
          \        return json.dumps({\"error\": \"无效的JSON数据\"}, ensure_ascii=False)\n\
          \n    result = {\"book_analysis\": {\"chapters\": []}}\n    \n    for chapter\
          \ in parsed_data.get(\"book_analysis\", {}).get(\"chapters\", []):\n   \
          \     chapter_info = {\n            \"chapter_title\": chapter[\"chapter\"\
          ].get(\"title\", \"N/A\"),\n            \"subtopics\": []\n        }\n \
          \       \n        for subtopic in chapter.get(\"subtopics\", []):\n    \
          \        subtopic_info = {\n                \"content_index\": subtopic.get(\"\
          content_index\", \"N/A\"),\n                \"subtopic_title\": subtopic.get(\"\
          subtopic_title\", \"N/A\"),\n                \"viewpoints\": [],  # 兼容原格式的观点\n\
          \                \"events\": []       # 新增：兼容事件格式\n            }\n     \
          \       \n            # 处理原格式的主要观点\n            for viewpoint in subtopic.get(\"\
          main_viewpoints\", []):\n                subtopic_info[\"viewpoints\"].append({\n\
          \                    \"viewpoint\": viewpoint.get(\"viewpoint\", \"N/A\"\
          ),\n                })\n            \n            # 处理新格式的事件（提取所有事件内容）\n\
          \            for event in subtopic.get(\"events\", []):\n              \
          \  subtopic_info[\"events\"].append({\n                    \"event_title\"\
          : event.get(\"event_title\", \"N/A\"),\n                    \"event_process\"\
          : event.get(\"event_process\", []),\n                })\n            \n\
          \            chapter_info[\"subtopics\"].append(subtopic_info)\n       \
          \ \n        result[\"book_analysis\"][\"chapters\"].append(chapter_info)\n\
          \    \n    # 转换为JSON字符串返回\n    return {\n        \"result\": json.dumps(result,\
          \ ensure_ascii=False, separators=(\",\", \":\"))\n    }\n\n"
        code_language: python3
