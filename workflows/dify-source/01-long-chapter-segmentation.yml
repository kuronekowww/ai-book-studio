          role: system
          text: "# 你的任务\n根据输入的json格式的小说文本，识别文本内容，在原章节标题“title”的基础上，对文本再进行分段，添加分节的小标题“section_title”\n\
            \n# 输出示例\n```text\n{\n    \"sectionContents\": [\n        {\n        \
            \    \"section_title\":\"小标题名\",\n            \"first_sentence\":\"一直被幼年丧父的阴霾笼罩的企业高管，在外人看来光鲜亮丽，坐拥一切，但内心极度自我贬低，觉得自己一无是处。亚隆如何陪伴他走出内心的恐惧？\"\
            \n        }\n],\n    \"title\": \"引言\"\n  }\n```\n"
        - id: 51c3fff8-9ced-4ba8-97a3-7178e19f1a9b
          role: user
          text: "# 任务\n基于以下章节的原文内容，按语义逻辑划分成多个小节，步骤如下：\n1. 计算总字数：统计当前章节原文的总字数（不含标题）；\n\
            2. 确定分段数量：\n   - 总字数＜6000，划分为2段；\n   - 6000≤总字数＜12000，划分为3段；\n   - 总字数≥12000，划分为n段，每段4000字左右。\n\
            3. 每个分段后的小节字数必须在4000字左右。\n4. 按照要求划分小节。\n\n## 要求\n1. 小节划分需符合“语义完整性”：每个小节围绕一个子主题展开（如“蒸汽机的改良历程”“纺织机械的技术迭代”），必须保留完整情节，事件、论证或概念。\
            \  \n2. 如果文本中含有以markdown的\"####\"标识（例如“####建造一个特洛伊木马”），或以短词语+换行标识（例如：“\\\
            n\\n门槛上的人 \\n\\n”）的内容，则优先将其识别为小标题。\n3. 为每个小节生成：  \n   - 小节标题（简洁，10-20字，体现子主题，类似目录小标题）；\
            \  \n   - 小节首句（必须是该小节在原文中的**第一句话**，一字不差，包含标点符号）。  \n4. 输出格式：严格使用JSON数组，保留输入的章节标题\"\
            title\"，在\"sectionContents\"中，每个元素对应一个小节，包含“section_title”（小节标题）、“first_sentence”（首句原文）。\
            \  \n5. 确保所有小节首句在原文中真实存在，且按原文顺序排列（不可颠倒）\n6. 每个章节中，各小节字数应该平均分配，小节之间的字数之差应该小于2000字\n\
            \n## 书籍原文内容\n{{#1752820719870.item#}}\n"
