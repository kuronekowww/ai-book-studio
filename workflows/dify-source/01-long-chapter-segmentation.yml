    - data:
        code: "import json\nimport os\nimport re\n\ndef clean_for_match(s):\n    \"\
          \"\"去除所有标点符号（包括中英文标点）和空白字符，只保留中文、英文、数字\"\"\"\n    s = re.sub(r'[\\s]', '',\
          \ s)  # 先去掉所有空白\n    s = re.sub(r'[^\\u4e00-\\u9fa5a-zA-Z0-9]', '', s) \
          \ # 再去掉所有标点\n    return s\n\ndef find_sentence_fuzzy(content, sentence):\n\
          \    \"\"\"模糊查找句子在内容中的精确起始位置\"\"\"\n    # 1. 精确查找 - 优先使用精确匹配\n    idx =\
          \ content.find(sentence)\n    if idx != -1:\n        return idx\n\n    #\
          \ 2. 去除所有空白字符后查找\n    content_no_space = re.sub(r'[\\s]', '', content)\n\
          \    sentence_no_space = re.sub(r'[\\s]', '', sentence)\n    idx = content_no_space.find(sentence_no_space)\n\
          \    if idx != -1:\n        # 回溯原文位置 - 修正版\n        count = 0\n        original_pos\
          \ = 0\n        for i, c in enumerate(content):\n            if c.strip()\
          \ != '':\n                if count == idx:\n                    original_pos\
          \ = i\n                    break\n                count += 1\n        return\
          \ original_pos\n\n    # 3. 去除标点和空白后查找\n    content_clean = clean_for_match(content)\n\
          \    sentence_clean = clean_for_match(sentence)\n    idx = content_clean.find(sentence_clean)\n\
          \    if idx != -1:\n        # 回溯原文位置 - 修正版\n        count = 0\n        original_pos\
          \ = 0\n        for i, c in enumerate(content):\n            if re.match(r'[\\\
          u4e00-\\u9fa5a-zA-Z0-9]', c):\n                if count == idx:\n      \
          \              original_pos = i\n                    break\n           \
          \     count += 1\n        return original_pos\n\n    # 4. 前12字滑动窗口模糊查找\n\
          \    head = sentence_clean[:12] if len(sentence_clean) > 12 else sentence_clean\n\
          \    idx = content_clean.find(head)\n    if idx != -1:\n        count =\
          \ 0\n        original_pos = 0\n        for i, c in enumerate(content):\n\
          \            if re.match(r'[\\u4e00-\\u9fa5a-zA-Z0-9]', c):\n          \
          \      if count == idx:\n                    original_pos = i\n        \
          \            break\n                count += 1\n        return original_pos\n\
          \n    # 5. 查找失败，输出详细调试信息\n    print(f\"警告：找不到锚点，章节内容前200字：{content[:200]}\"\
          )\n    print(f\"警告：找不到锚点，小节首句：{sentence}\")\n    print(f\"警告：处理后首句：{sentence_clean}\"\
          )\n    print(f\"警告：原文清洗后前200字：{content_clean[:200]}\")\n    return -1\n\n\
          def main(input_json_str, section_json_str):\n    \"\"\"\n    主函数：处理书籍章节分段\n\
          \    \n    Args:\n        input_json_str (str): 结构化书籍的JSON字符串\n        section_json_str\
          \ (str): dify流程输出的JSON字符串\n        \n    Returns:\n        str: 处理后的JSON字符串\n\
          \    \"\"\"\n    # 解析JSON字符串\n    data = json.loads(input_json_str)\n  \
          \  section_titles_list = json.loads(section_json_str)\n\n    # 构建章节标题到小节列表的映射\n\
          \    title_to_sections = {}\n    for chapter in section_titles_list:\n \
          \       title = chapter.get('title', '').strip()\n        section_contents\
          \ = chapter.get('sectionContents', [])\n        title_to_sections[title]\
          \ = section_contents\n\n    # 处理每章\n    for chapter in data.get('chapterContents',\
          \ []):\n        chapter_title = chapter.get('title', '').strip()\n     \
          \   content = chapter.get('content', '')\n        section_info = title_to_sections.get(chapter_title,\
          \ [])\n        section_contents = []\n        if not section_info or not\
          \ content:\n            chapter['sectionContents'] = []\n            continue\n\
          \n        # 找到每个小节的起始位置\n        starts = []\n        for info in section_info:\n\
          \            first_sentence = info['first_sentence'].strip()\n         \
          \   idx = find_sentence_fuzzy(content, first_sentence)\n            if idx\
          \ == -1:\n                print(f\"警告：在章节《{chapter_title}》中找不到小节锚点：{first_sentence[:20]}...\"\
          )\n                continue\n            starts.append((idx, info['section_title'],\
          \ first_sentence))\n        \n        # 按起始位置排序\n        starts.sort()\n\
          \        \n        # 切分内容\n        for i, (start_idx, sec_title, first_sentence)\
          \ in enumerate(starts):\n            # 确定当前小节的结束位置\n            if i + 1\
          \ < len(starts):\n                end_idx = starts[i+1][0]\n           \
          \ else:\n                end_idx = len(content)\n            \n        \
          \    # 提取当前小节的内容（从首句开始到下一小节开始前）\n            sec_content = content[start_idx:end_idx].strip()\n\
          \            \n            section_contents.append({\n                'title':\
          \ sec_title,\n                'content': sec_content\n            })\n \
          \       \n        chapter['sectionContents'] = section_contents\n\n    #\
          \ 返回处理后的JSON字符串\n    return {\n        \"result\": data\n    }\n"
        code_language: python3
        desc: ''
