    - data:
        code: "\nimport json\nimport re\ndef clean_json_string(s):\n    \"\"\"增强版清洗：处理单引号、转义符和格式标记\"\
          \"\"\n    # 1. 去除```json标记\n    s = re.sub(r'^```json\\s*', '', s, flags=re.IGNORECASE)\n\
          \    s = re.sub(r'\\s*```$', '', s)\n    # 2. 处理单引号（JSON中允许单引号，但统一转义为\\\
          '避免冲突）\n    s = s.replace(\"'\", \"\\\\'\")\n    # 3. 修正转义符（确保\\\\n被正确识别为换行符转义）\n\
          \    s = re.sub(r'\\\\\\\\n', r'\\\\n', s)  # 避免\\\\\\\\n被误解析为两个反斜杠\n  \
          \  return s.strip()\n\ndef extract_chapters(input_array):\n    extracted\
          \ = []\n    for idx, item in enumerate(input_array):\n        try:\n   \
          \         # 清洗当前元素\n            cleaned = clean_json_string(item)\n    \
          \        # 解析为JSON\n            chapter = json.loads(cleaned)\n        \
          \    # 验证必要字段\n            if \"title\" in chapter and \"sectionContents\"\
          \ in chapter:\n                extracted.append(chapter)\n             \
          \   print(f\"✅ 第{idx+1}个元素：成功提取《{chapter['title']}》\")\n            else:\n\
          \                print(f\"❌ 第{idx+1}个元素：缺少title或sectionContents\")\n   \
          \     except json.JSONDecodeError as e:\n            print(f\"❌ 第{idx+1}个元素解析失败（位置：{e.pos}）：{e}\"\
          )\n            # 打印错误位置附近的内容（方便排查）\n            error_context = cleaned[max(0,\
          \ e.pos-30):e.pos+30]\n            print(f\"   错误位置附近：{error_context}\"\
          )\n        except Exception as e:\n            print(f\"❌ 第{idx+1}个元素处理失败：{e}\"\
          )\n    return extracted\n\ndef main(input_array: str):\n    # 执行合并\n   \
          \ merged_result = extract_chapters(input_array)\n\n# 输出合并后的JSON（格式化显示）\n\
          \    return {\n        \"result\": json.dumps(merged_result, ensure_ascii=False,\
          \ indent=2),\n    }\n"
        code_language: python3
