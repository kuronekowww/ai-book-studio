        - id: 18ea6842-e99e-4ef3-a7d9-e7aba0af80a5
          role: user
          text: '# 你的任务

            根据输入的声音内容框架和参考书籍内容，分析并设计声音内容大纲。


            # 书籍内容

            {{#1745484026846.reference#}}

            '
        - id: 59ff9f24-ae49-4e82-8cde-4d119fd2a713
          role: assistant
          text: '理解大纲框架中的元素和目的：

            1. 过渡主题

            简要描述本过渡声音的核心任务（衔接哪两个章节/知识点）。

            2. 回顾上一部分的要点

            要点1

            要点2

            3. 过渡核心

            点明上下章节之间的内在联系（可以是主题、观点、逻辑链或作者思维方式的延伸）。

            根据需要，补充背景或关联信息，帮助听众对接下来的内容做好准备。

            4. 引导预告

            简洁介绍下一个章节的核心议题或引发的新问题，激发兴趣。

            给出期待感或思考方向，强调继续聆听的意义。



            理解观点的要求：

            - 新颖：打破常规思维，比如从相反的角度看问题，或者结合跨领域的知识，在初始困惑后引发认知重组；

            - 反差和反转：通过设定对比强烈的场景或挑战传统观念来实现，使人同时体验到"这不可能是对的"和"这必然是对的"的矛盾感；

            - 深度且有锐度：陈述现象，还要分析背后的原因、影响，甚至提出解决方案，能让人重新审视长期持有但从未质疑的基本假设，产生"我怎么从未这样想过"的顿悟体验；'
        - id: cd00bc58-7042-4f5d-8be4-e272e5b93210
          role: user
          text: '## 要求

            1. 结合声音主题和分析思考过程，设计书籍的解读方式，帮用户听得懂，用得上；

            2. 理解大纲框架中的元素和目的，从目标人群的用户视角出发设计大纲内容，帮助用户读懂书籍并且能对知识加以运用。

            4. **必须严格按照声音内容框架中提及的内容撰写大纲，禁止超出声音内容框架的范围**。原封不动地保留引用的书籍中的金句或表述，禁止编造书籍名称。

            5. 大纲中的观点和论据，需要能输出新颖、有锐度且有价值的内容，确保能结合该观点和书籍内容进行有依据的阐述，逻辑流畅且合理，避免幻觉。

            6. 参考输出格式，仅需要输出类播客的声音内容大纲，言简洁精准，输出在文本框中。


            # 声音内容框架

            {{#1745484026846.outline#}}

            '
