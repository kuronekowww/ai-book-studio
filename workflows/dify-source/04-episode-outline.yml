  conversation_variables: []
  environment_variables:
  - description: ''
    id: 5a742fbc-d646-4bb0-ba9b-60a2be0e9cae
    name: style
    selector:
    - env
    - style
    value: '1.通俗化的类口语表达

      采用与观众“聊天”的语气，避免刻板学术化，让高门槛的学术内容也能够轻松融入日常语境。使用类口语化句式，用短句、问答的方式结合，听感更易消化。

      2.比喻和生活化案例增强趣味性

      用具体行为或形象化场景解释高深概念，让观众更好代入。

      3.提问式引导，提前代替观众提问

      使用自问自答或预设反问的形式，既点出疑问，又顺势解释，持续引导观众思考。“答案感”明确的表达，很容易让观众带着问题被带到下一个点。

      4.幽默与反思并举

      以一种自嘲幽默的方式说明观点或问题，轻松而发人深省。

      同时，通过略带反人性的观点（如“可以为了存钱而存钱”“花得少才是富有”），直接挑战观众认知，引发思考。

      5. 适当使用对比/夸张手法吸引注意力

      6. 适量使用网络文化与流行梗

      用“红茶婊”“绿茶婊”“PS”“高跟鞋”等流行文化的元素，结合普通人熟悉的调侃词汇，增加了内容的趣味性和亲切感。

      7. 加强情绪共鸣

      针对主要受众（男性与女性）塑造情绪共鸣点。

      8. 多用短句，紧凑有力

      简短清晰的表达，避免语言拖沓，增强逻辑感和可读性。

      9. 观点反复强化

      多次重复文稿中的核心观点/概念，以不同案例进行论证，增强记忆点。

      10. “可以聊天”的叙事感

      文稿像朋友间聊天一样的“娓娓道来”，让人不自觉想要多听、继续听。这种叙述方式适合科普类内容的受众，尤其是某些非高认知门槛的群体。'
    value_type: string
