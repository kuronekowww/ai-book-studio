app:
  description: ''
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: 【就书讲书】文本风格
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: ''
    id: 8daa901d-5ef4-4fdd-a3e3-5ad3c1fef0a2
    name: style_history
    selector:
    - env
    - style_history
    value: '一、整体定位

      "聪明朋友在跟你聊天" —— 不是教授讲课，不是新闻播报，而是一个懂行的人在用日常语言把复杂的事讲透。兼具权威感与亲近感，让读者觉得"这人真懂，而且讲得我也懂"。


      二、语言层面

      1. 人称与对话感


      全程使用"你"直接对话，制造一对一交流的错觉

      常用句式："你别看……""你会发现……""你别小看……""如果你问我……""你大概已经能明白……"

      偶尔用"我"表达个人判断，增加真实感："如果你问我……我会说……"

      2. 句子节奏：长短交替，短句打节奏


      大量使用单句成段，制造停顿和强调

      短句密集输出时像"连击"，营造紧迫感；长句展开时像"缓坡"，用于解释和铺陈

      示例节奏模式：

      短 → 短 → 短 → 长（解释）→ 短（收束）

      问句 → 短答 → 展开 → 再收束

      3. 口语化但不随意


      用词偏口语但不粗俗："够麻烦了""闹得厉害""一碰就炸""打得又狠又难收"

      避免学术术语堆砌；如果必须出现专业概念，立即用大白话解释

      不用"首先、其次、再次"这类机械连接词，用语义自然过渡

      4. 否定—转折—肯定 三段式（核心句式）


      "不是A，而是B"——最高频的句式结构

      "不是没有办法，而是每一个办法都有巨大的代价"

      "不是单纯为了资源，而是为了身份、历史和正统"

      这个句式的作用：先破除读者的简单认知，再给出更深的理解

      5. 排比与并列：制造气势和信息密度


      三项或以上的并列铺陈，节奏整齐但内容递进

      示例："它没有纽约那样的金融地位，也没有东京那样的人口规模，没有上海那样的经济活力，也不像迪拜那样靠摩天楼和资本神话吸人眼球。"

      示例："宗教雷、历史雷、身份雷、现实安全雷、国际政治雷"

      三、结构层面

      1. 开头：用一个生动的比喻/类比"定锚"


      不从定义、背景、时间线开始

      直接抛出一个读者能秒懂的类比，把陌生问题拉进日常经验

      示例：用"祖上没分干净的家产纠纷"来锚定中东问题

      2. 正文：层层剥洋葱，每层都有"钩子"


      每个大段落解决一个问题，段落之间用反问句或悬念句过渡

      常见过渡方式：

      "为什么？"（直接提问，然后回答）

      "这就像什么？"（引出类比）

      "这意味着什么？"（从事实上升到意义）

      "你看，问题一下就出来了。"（标记转折点）

      3. 多视角平行呈现：不替读者选立场


      用"对A来说……对B来说……对C来说……"的结构，公平呈现各方视角

      让读者自己感受到矛盾的真实张力，而不是被灌输某个结论

      在呈现完各方视角后，总结矛盾的结构性本质："这才是真正的死结"

      4. 结尾：收束为几条清晰洞察


      不烂尾、不敷衍，用"第一……第二……第三……"提炼出本节核心认知

      最后一两句话要有"余味"，让人觉得这个问题比自己想的更深

      可预告下一节内容，但点到为止，不剧透

      四、说理层面

      1. 核心方法：类比降维


      把抽象/宏大的问题，翻译成日常生活中人人有体感的场景

      "祖宅"比喻耶路撒冷、"家产纠纷"比喻中东冲突、"房客"比喻三大宗教

      类比的标准：读者不需要任何背景知识就能理解

      2. 反常识切入


      先说出读者可能有的简单认知，然后翻转或深化

      "很多人一说中东，就会简单地来一句……这句话只说对了一半。"

      "很多人容易误以为……其实不是。"

      3. 讲规律而不只讲故事


      叙述完具体事件后，要抽象出一条可迁移的"人性规律"或"历史规律"

      示例："你天天拥有的东西，未必最神圣；你失去很久、却始终没忘的东西，反而会越来越神圣。"

      这些规律性总结是讲书稿的"金句层"，也是读者记住并传播的核心

      4. 承认复杂性，拒绝简单化


      明确告诉读者"这个问题不能用一句话讲完"，但不是为了炫耀复杂，而是为了尊重真实

      "不是不能做价值判断，而是不能偷懒。"

      这种态度本身就构成一种说服力

      五、情绪管理

      1. 克制但不冷漠


      不煽情、不喊口号、不站队，但允许出现"残酷""讽刺""黑色幽默"这类情绪标注词

      让事实和结构本身产生情感冲击力，而不是靠形容词堆砌

      2. 反问句控制节奏，不过度使用


      反问句用于制造停顿、引发思考，但不能每段都用，否则变成质问

      最佳频率：每个大段落1-2个反问，放在关键转折处

      3. 幽默感低调嵌入


      偶尔出现轻松的表述调节气氛："有点黑色幽默""够麻烦了""恭喜你，你其实已经摸到门把手了"

      幽默不能抢走严肃议题的重量，只起"透气"作用

      六、禁忌清单

      不用"众所周知""不言而喻"等空话

      不用"让我们一起来看看"等综艺式引导语

      不堆砌数据和年份，除非数字本身有冲击力

      不做道德审判式的总结（"所以XX是错的"）

      不写只有信息没有观点的流水账

      不在段落内"自问自答"超过两轮，否则变得啰嗦'
    value_type: string
  - description: ''
    id: c0213ac6-a692-4276-a009-10560f8eaca8
    name: style_story
    selector:
    - env
    - style_story
    value: '1. 唠嗑式代入感

      - 用日常对话的松弛语气，自然穿插互动短语，将人物经历转化为听众可共鸣的普遍场景。

      2. 连环扣式悬念

      - 按时间线递进抛出未解决的矛盾，用衔接词串联，每个悬念均锚定原始素材中的具体细节。

      3. 保留原文细节

      - 从原始素材中提保留细节以增强可信度，避免泛化描述。

      4. 体感化共情

      - 用具象生理反应替代抽象情绪词汇，触发听众的体感记忆以增强共鸣。

      5. 剥洋葱式解读

      - 从多重身份维度（如职业角色、个人身份等）解析人物行为，每个维度均对应原始素材中的具体表现。'
    value_type: string
  - description: ''
    id: 4332a36a-1e68-4288-8513-336e267b275b
    name: style_mental
    selector:
    - env
    - style_mental
    value: "1. 通俗化的类口语表达:采用与读者“聊天”的语气，避免高冷的学术化表达，使抽象的哲学理念融入日常语境。\n\n2. 降低理解门槛，使用比喻和生活化案例增强趣味性\n\
      \n3. 提问式引导，通过自问自答促进读者思考\n\n4. 幽默与反思并举，轻松而发人深省\n   通过生活化场景和细腻反思呈现哲理化内容，让表达更具沉浸感。\n\
      \n5. 使用对比、层次与形象化手法强化表达\n\n6. 精准解读原文金句，尊重原意不篡改\n\n7. 构建情绪共鸣，通过真实场景引发内心连接\n  \
      \ 用贴近现实的场景吸引读者，同时增强情绪代入。\n\n8. 使用短句为主，表达紧凑有力\n\n9. 观点反复强化，增强记忆点 \n    通过不同的例子和角度反复论证观点，帮助读者深化对这一概念的理解。每段核心都有层层递进的解读，使观点显得更扎实、更具说服力。\n\
      \n10. 娓娓道来的叙事感，就像朋友聊天 \n    文本整体叙事风格流畅自然，像朋友间聊天般清新可亲，同时逻辑清晰、有条不紊。"
    value_type: string
  - description: ''
    id: db1855d3-2bac-404b-b0de-3fa2714b3fcb
    name: style_bilibili
    selector:
    - env
    - style_bilibili
    value: '1.通俗化的类口语表达

      采用与观众“聊天”的语气，避免刻板学术化，让高门槛的学术内容也能够轻松融入日常语境。使用类口语化句式，用短句、问答的方式结合，听感更易消化。

      2.提问式引导，提前代替观众提问

      使用自问自答或预设反问的形式，既点出疑问，又顺势解释，持续引导观众思考。“答案感”明确的表达，很容易让观众带着问题被带到下一个点。

      . 适当使用对比手法吸引注意力

      3. 多用短句，紧凑有力

      简短清晰的表达，避免语言拖沓，增强逻辑感和可读性。

      4. 观点反复强化

      多次重复文稿中的核心观点/概念，以不同案例进行论证，增强记忆点。

      5. “可以聊天”的叙事感

      文稿像朋友间聊天一样的“娓娓道来”，让人不自觉想要多听、继续听。'
    value_type: string
