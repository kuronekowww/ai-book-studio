            ### 内容要求

            - 对数据/事件/专有名词需要配以具体解释说明，使用生动的比喻帮助理解；

            - 清晰说明因果关系；

            - 重要观点需要用强调语气突出；

            - 全文中，对书籍原作者的称呼保持一致：使用其最常用的称呼，避免使听众产生混淆；重点在讲述故事，不用提及作者。

            - 原封不动地保留引用的书籍中的金句或表述


            ## 文本风格

            使用多样化的句式，避免重复性用词或拗口的表述

