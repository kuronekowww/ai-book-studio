app:
  description: ''
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: 【就书讲书】声音初稿
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: ''
    id: b16a06bc-e2a3-4116-b969-34bb093faf07
    name: style_story
    selector:
    - env
    - style_story
    value: '1. 唠嗑式代入感

      - 用日常对话的松弛语气，自然穿插 “你懂的”“换作是你” 等互动短语，将人物经历转化为听众可共鸣的普遍场景。

      2. 连环扣式悬念

      - 按时间线递进抛出未解决的矛盾，用 “更关键的是”“事情并没结束” 等衔接词串联，每个悬念均锚定原始素材中的具体细节。

      3. 保留原文细节

      - 从原始素材中提保留细节以增强可信度，避免泛化描述。

      4. 体感化共情

      - 用具象生理反应替代抽象情绪词汇，触发听众的体感记忆以增强共鸣。

      5. 剥洋葱式解读

      - 从多重身份维度（如职业角色、个人身份等）解析人物行为，每个维度均对应原始素材中的具体表现。'
    value_type: string
  - description: ''
    id: b7c7a847-8e38-4b9a-9338-35f3fea63d45
    name: style_bilibili
    selector:
    - env
    - style_bilibili
    value: '1.通俗化的类口语表达

      采用与观众“聊天”的语气，避免刻板学术化，让高门槛的学术内容也能够轻松融入日常语境。使用类口语化句式，用短句、问答的方式结合，听感更易消化。

      2.比喻和生活化案例增强趣味性

      用具体行为或形象化场景解释高深概念，让观众更好代入。

      3.提问式引导，提前代替观众提问

      使用自问自答或预设反问的形式，既点出疑问，又顺势解释，持续引导观众思考。“答案感”明确的表达，很容易让观众带着问题被带到下一个点。

      4.幽默与反思并举

      以一种自嘲幽默的方式说明观点或问题，轻松而发人深省。

      同时，通过略带反人性的观点（如“可以为了存钱而存钱”“花得少才是富有”），直接挑战观众认知，引发思考。

      5. 适当使用对比手法吸引注意力

      6. 适量使用网络文化与流行梗

      7. 加强情绪共鸣

      8. 多用短句，紧凑有力

      简短清晰的表达，避免语言拖沓，增强逻辑感和可读性。

      9. 观点反复强化

      多次重复文稿中的核心观点/概念，以不同案例进行论证，增强记忆点。

      10. “可以聊天”的叙事感

      文稿像朋友间聊天一样的“娓娓道来”，让人不自觉想要多听、继续听。'
    value_type: string
  - description: ''
    id: b27adcd3-a681-4140-9c7e-ff97455f09b7
    name: style_mental
    selector:
    - env
    - style_mental
    value: "1. 通俗化的类口语表达:采用与读者“聊天”的语气，避免高冷的学术化表达，使抽象的哲学理念融入日常语境。\n\n2. 降低理解门槛，使用比喻和生活化案例增强趣味性\n\
      \n3. 提问式引导，通过自问自答促进读者思考\n\n4. 幽默与反思并举，轻松而发人深省\n   通过生活化场景和细腻反思呈现哲理化内容，让表达更具沉浸感。\n\
      \n5. 使用对比、层次与形象化手法强化表达\n\n6. 精准解读原文金句，尊重原意不篡改\n\n7. 构建情绪共鸣，通过真实场景引发内心连接\n  \
      \ 用贴近现实的场景吸引读者，同时增强情绪代入。\n\n8. 使用短句为主，表达紧凑有力\n\n9. 观点反复强化，增强记忆点 \n    通过不同的例子和角度反复论证观点，帮助读者深化对这一概念的理解。每段核心都有层层递进的解读，使观点显得更扎实、更具说服力。\n\
      \n10. 娓娓道来的叙事感，就像朋友聊天 \n    文本整体叙事风格流畅自然，像朋友间聊天般清新可亲，同时逻辑清晰、有条不紊。"
    value_type: string
  - description: ''
    id: 627fdb6f-260a-4e55-81b6-7e2549fc36a2
    name: style
    selector:
    - env
    - style
    value: '1、问题驱动式构建

      用提问开局并贯穿始终，通过悬疑或反思问题与听众建立互动性，让听众在过程中始终保持好奇心。例如“脆弱的反面是什么？”“为什么有些人无法摆脱贫穷？”


      2、 鲜明对比与二元论述

      通过对立内容的强烈对比（如“脆弱 vs 反脆弱”“贫穷陷阱 vs 创业思维”“快乐分子 vs 当下分子”），强化记忆点，帮助听众快速理解复杂概念。


      3、故事化叙述

      将学术性内容拆解为紧凑的故事，在案例描述中逐层铺开理论逻辑，让听众跟随故事探索知识。


      4、 用金句提炼核心洞察

      文本中嵌入适当密度的富有哲理性，传播力强的金句，增强用户在听节目过程中的获得感，创造峰值体验。


      5、通俗化与专业性平衡

      强化知识深度的同时，尽可能进行通俗化处理，避免学术性术语破坏听觉流畅感。例如用朴素平实的语言替代过于专业的词汇。


      6、互动性与代入感

      使用互动性语言，让听众沉浸在听书节目的讨论氛围中，增强用户的参与感。如“你有没有想过这个问题？”、“听到这里是不是有点出冷汗？”，


      7、多维角度剖析

      分析解释一个议题或者现象，从不同科学维度，比如生物学、心理学或者社会学，做解释，帮助用户打破学科壁垒，拓展视野提升认知。

      '
    value_type: string
