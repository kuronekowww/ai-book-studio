            ## 要求

            1. 结合声音大纲，分析如何总结前序知识内容，原封不动地保留引用的书籍中的金句或表述，帮助听众更好地吸收并实际运用；

            2. 书籍解读内容具有连贯性，结合上一部分内容的核心，设计过渡观点和论据，自然衔接到下一知识模块，并简单预告之后要解读的内容；

            3. 避免任何视觉化符号、加粗、序号、括号、结构性内容或小标题；

            3. 输出基于声音大纲创作的文稿内容，1000字左右；


