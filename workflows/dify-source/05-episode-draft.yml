            ## 文稿风格

            - 轻松、幽默、有趣、有料

            - 文本内容连贯流畅，避免结构性的内容

            - 口语化，深入浅出，使用简单、生动的词汇解释专业话题

            - 避免使用带有说教感的词汇


            ### 结构要求

            - 每个主要段落需要有明确的主题转换和过渡句，引导出下文要讨论的重点内容；

            - 句子与句子之间，语义和语义之间，段落与段落之间，模块与模块之间，都要有清晰的逻辑衔接和过渡性语言；


            ### 内容要求

            - **对数据/事件/专有名词需要配以具体解释说明，使用生动的比喻或例子帮助理解**；

            - 清晰说明因果关系；

            - 重要观点需要用强调语气突出；

            - 全文中，对书籍原作者的称呼保持一致：使用其最常用的称呼，避免使听众产生混淆；

            - 原封不动地保留引用的书籍中的金句或表述，禁止编造书籍名称

