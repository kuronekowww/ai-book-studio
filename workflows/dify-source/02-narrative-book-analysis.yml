            子主题和章节标题请严格按照输入的title为准，不要添加任何多余内容和符号，也不要优化格式。

            内容索引请严格按照以下格式，使用冒号标识以确保准确解析：

            **内容索引：** 章节：章节标题 子主题：子主题标题

            **说明：**

            - 章节标题前加"章节："标识

            - 子主题标题前加"子主题："标识

            - 两者之间用空格分隔

            - 这样即使标题中包含空格也能通过冒号准确分割获取标题内容'
