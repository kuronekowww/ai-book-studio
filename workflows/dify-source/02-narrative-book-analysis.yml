    - data:
        code: "# -*- coding: utf-8 -*-\nimport json\nfrom typing import Union, Dict,\
          \ List, Any\n\n\ndef main(input_data: Union[str, Dict[str, Any]]) -> Dict[str,\
          \ Any]:\n    \"\"\"\n    处理JSON字符串数据，合并不同的book_analysis章节\n    支持两种数据格式：\n\
          \    1. input_data数组包含JSON字符串\n    2. input_data数组包含已解析的JSON对象\n\n    Args:\n\
          \        input_data: 可以是JSON字符串或已解析的字典\n\n    Returns:\n        包含合并结果的字典\n\
          \    \"\"\"\n    # 解析输入数据\n    if isinstance(input_data, str):\n       \
          \ data = json.loads(input_data)\n    else:\n        data = input_data\n\n\
          \    # 验证输入数据格式\n    if not isinstance(data, dict) or \"input_data\" not\
          \ in data:\n        raise ValueError(\"输入数据格式不正确，应包含input_data字段的字典\")\n\
          \n    if not isinstance(data[\"input_data\"], list):\n        raise ValueError(\"\
          input_data字段应该是一个列表\")\n\n    merged_book = {\n        \"book_analysis\"\
          : {\n            \"chapters\": []\n        }\n    }\n\n    for item in data[\"\
          input_data\"]:\n        # 处理两种情况：字符串格式或已解析的对象格式\n        if isinstance(item,\
          \ str):\n            # 原有逻辑：处理JSON字符串\n            clean_item = item.strip()\n\
          \            try:\n                parsed_data = json.loads(clean_item)\n\
          \            except json.JSONDecodeError:\n                continue\n  \
          \      elif isinstance(item, dict):\n            # 新逻辑：直接处理已解析的JSON对象\n\
          \            parsed_data = item\n        else:\n            # 跳过其他类型的数据\n\
          \            continue\n\n        # 检查是否包含所需的结构并合并\n        if (isinstance(parsed_data,\
          \ dict) and\n                \"book_analysis\" in parsed_data and\n    \
          \            isinstance(parsed_data[\"book_analysis\"], dict) and\n    \
          \            \"chapters\" in parsed_data[\"book_analysis\"] and\n      \
          \          isinstance(parsed_data[\"book_analysis\"][\"chapters\"], list)):\n\
          \            merged_book[\"book_analysis\"][\"chapters\"].extend(\n    \
          \            parsed_data[\"book_analysis\"][\"chapters\"]\n            )\n\
          \n    result = {\n        \"result\": merged_book,\n    }\n\n    return\
          \ result"
        code_language: python3
