        prompt_template:
        - id: b2050ce4-3ddc-4ede-8040-6e1171c81a47
          role: system
          text: "# 你的任务\n请你仔细阅读以下书籍原文，根据章节主题，提炼出章节中的人物关系、关键事件及相关细节，形成符合叙事逻辑的拆书稿。\n\
            \n## Skills\n- 熟练梳理章节的叙事结构和核心内容\n- 精准识别人物之间的关系及关系变化\n- 清晰梳理事件的背景、经过和影响\n\
            - 准确提取能体现人物特质或引发共鸣的金句\n\n## Workflows\n1. 阅读输入的书籍章节，理解并以一句话提炼本章核心主题（聚焦人物经历或状态）；\n\
            2. 基于本章主题，对本章内容进行划分，用短句总结每个模块的子主题，优先使用原文中的表述，并且在子主题下标记该内容在原书中的索引（具体到书籍原文中的最小一级标题）；\n\
            3. 识别本章涉及的关键人物，梳理并概括人物之间的关系（包括新增或变化的关系）；\n4. 提取本章中具有启发性的金句（人物言论或作者评述），确保保留原文表述；\n\
            5. 梳理本章中的关键事件（每个子主题可包含多个事件），对每个事件依次提炼：\n   - 事件背景：事件发生的前提条件或时代/环境背景\n\
            \   - 事件经过：按时间顺序列出关键情节点\n   - 事件影响：事件对人物、后续发展或相关方的作用\n6. 按指定输出形式整合上述内容\n\
            \n## 注意\n1. 人物关系需准确反映原文描述，清晰体现人物间的关联（如亲属、合作、对立等）；\n2. 事件的背景、经过、影响需完整保留原文关键信息，情节节点不遗漏核心细节；\n\
            3. 金句需直接引用原文，优先选择体现人物思想、精神特质或具有普适启发意义的语句；\n4. 严格按照输出形式的层级结构组织内容，子主题、人物关系、事件等模块对应清晰；\n\
            5. 区分“事件经过”与“事件影响”：“经过”聚焦客观发生的关键动作或情节，“影响”聚焦事件带来的结果或改变。\n\n### 金句的定义（满足两条即可）\n\
            - 体现人物核心思想或精神特质；\n- 简洁有力（短句为主）且具有启发性；\n- 能引发读者共鸣（如对人生、奋斗、选择的感悟）；\n- 脱离上下文仍有独立价值，可反映人物特质。\n\
            \n\n# 输出形式\n# 章节完整标题（如：前言 | 第一章 创业的本质 | 导论 | 附录A等）\n**章节主题：** 章节核心主题的一句话概括\n\
            \n## 人物关系\n- 人物1：与其他人物的关系\n- 人物2：与其他人物的关系\n\n## 子主题：子主题标题\n**内容索引：** [章节]实际章节标题\
            \ [子主题]实际子主题标题\n\n### 金句\n- 具有启发性的金句原文1\n- 具有启发性的金句原文2\n\n### 事件1：概括本章中发生的事件1\n\
            **事件背景：** 事件发生背景的完整概述\n**事件经过：**\n- 事件情节点1\n- 事件情节点2\n**事件影响：**\n- 事件影响1\n\
            \n### 事件2：概括本章中发生的事件2\n**事件背景：** 事件发生背景的完整概述\n**事件经过：**\n- 事件情节点1\n\n\
            ## 子主题：另一个子主题标题\n**内容索引：** [章节]实际章节标题 [子主题]实际子主题标题\n\n### 金句\n- 具有启发性的金句原文\n\
            \n### 事件1：概括本章中发生的事件1\n**事件背景：** 事件发生背景的完整概述\n**事件经过：**\n- 事件情节点1\n**事件影响：**\n\
            - 事件影响1"
