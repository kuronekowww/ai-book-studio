    - data:
        code: "# -*- coding: utf-8 -*-\n\nimport re\nimport json\nfrom typing import\
          \ Dict, List, Any\n\n\ndef main(text: str, chapterTitle: str, sectionTitles:\
          \ List[str]) -> Dict[str, Any]:\n    \"\"\"\n    解析人物传记书籍内容文本，转换为指定的JSON格式\n\
          \    \"\"\"\n\n    # 初始化结果结构\n    result = {\n        \"book_analysis\"\
          : {\n            \"book_analysis\": {\n                \"chapters\": []\n\
          \            }\n        }\n    }\n\n    # 按章节分割文本\n    chapter_sections\
          \ = re.split(r'\\n(?=# [^#])', text)\n    chapter_sections = [section.strip()\
          \ for section in chapter_sections if section.strip()]\n\n    for chapter_section\
          \ in chapter_sections:\n        if not chapter_section.startswith('#'):\n\
          \            continue\n\n        chapter_data = parse_chapter(chapter_section,\
          \ chapterTitle, sectionTitles)\n        if chapter_data:\n            result[\"\
          book_analysis\"][\"book_analysis\"][\"chapters\"].append(chapter_data)\n\
          \n    return result\n\n\ndef parse_chapter(chapter_text: str, chapter_theme:\
          \ str, section_titles: List[str]) -> Dict[str, Any]:\n    \"\"\"解析单个章节，先提取整章人物关系再传递给子主题\"\
          \"\"\n    lines = chapter_text.split('\\n')\n\n    # 解析章节标题\n    chapter_title\
          \ = \"\"\n    for line in lines:\n        if line.startswith('# '):\n  \
          \          chapter_title = line[2:].strip()\n            break\n\n    if\
          \ not chapter_title:\n        return None\n\n    # 提取章节级完整人物关系（新增逻辑）\n \
          \   chapter_relationships = extract_chapter_character_relationships(chapter_text)\n\
          \n    # 提取章节序号\n    chapter_number = extract_chapter_number(chapter_title)\n\
          \n    # 解析子主题时传入整章人物关系\n    subtopics = parse_subtopics(chapter_text, section_titles,\
          \ chapter_theme, chapter_relationships)\n\n    return {\n        \"chapter\"\
          : {\n            \"number\": chapter_number,\n            \"title\": chapter_title,\n\
          \            \"theme\": chapter_theme\n        },\n        \"subtopics\"\
          : subtopics\n    }\n\n\ndef extract_chapter_character_relationships(chapter_text:\
          \ str) -> List[Dict[str, str]]:\n    \"\"\"提取整章的完整人物关系（章节级二级标题）\"\"\"\n\
          \    relationships = []\n    # 匹配## 人物关系区块，终止于下一个二级标题（子主题）或章节结束\n    relationship_match\
          \ = re.search(\n        r'## 人物关系\\n(.*?)(?=## 子主题|# |$)',  # 关键调整：匹配到子主题开始前\n\
          \        chapter_text, \n        re.DOTALL\n    )\n    if not relationship_match:\n\
          \        return relationships\n\n    relationship_section = relationship_match.group(1)\n\
          \    # 提取人物及其关系描述（支持换行的关系说明）\n    relationship_pattern = r'- ([^：:]+)：([^\\\
          n]*(?:\\n(?!- )[^\\n]*)*)'\n    relationship_matches = re.findall(relationship_pattern,\
          \ relationship_section)\n\n    for person, relation in relationship_matches:\n\
          \        relationships.append({\n            \"character\": person.strip(),\n\
          \            \"relationship\": relation.strip().replace('\\n', ' ')  # 合并多行描述\n\
          \        })\n\n    return relationships\n\n\ndef extract_chapter_number(title:\
          \ str) -> str:\n    \"\"\"提取章节序号\"\"\"\n    patterns = [\n        r'(第[零一二三四五六七八九十百千万\\\
          d]+章)',\n        r'(前言|导论|序言|绪论|引言|结语|后记|参考文献)',\n        r'(附录[零一二三四五六七八九十百千万\\\
          d]*)',\n        r'(第[零一二三四五六七八九十百千万\\d]+部分)'\n    ]\n\n    for pattern in\
          \ patterns:\n        match = re.search(pattern, title)\n        if match:\n\
          \            return match.group(1)\n    return title\n\n\ndef parse_subtopics(\n\
          \    chapter_text: str, \n    subtopic_titles: List[str], \n    title: str,\
          \ \n    chapter_relationships: List[Dict[str, str]]  # 接收章节级人物关系\n) -> List[Dict[str,\
          \ Any]]:\n    \"\"\"解析子主题，每个子主题都包含整章人物关系\"\"\"\n    subtopics = []\n\n \
          \   if not subtopic_titles:\n        content_index = extract_content_index(chapter_text,\
          \ title, \"无\")\n        golden_quotes = extract_golden_quotes(chapter_text)\n\
          \        events = extract_events(chapter_text)\n\n        subtopic_data\
          \ = {\n            \"subtopic_title\": \"无\",\n            \"content_index\"\
          : content_index,\n            \"character_relationships\": chapter_relationships,\
          \  # 使用章节级关系\n            \"golden_quotes\": golden_quotes,\n          \
          \  \"events\": events\n        }\n        subtopics.append(subtopic_data)\n\
          \        return subtopics\n\n    subtopic_pattern = r'## 子主题：([^\\n]+)'\n\
          \    subtopic_matches = list(re.finditer(subtopic_pattern, chapter_text))\n\
          \n    if not subtopic_matches:\n        for subtopic_title in subtopic_titles:\n\
          \            if subtopic_title.strip():\n                content_index =\
          \ extract_content_index(chapter_text, title, subtopic_title)\n         \
          \       golden_quotes = extract_golden_quotes(chapter_text)\n          \
          \      events = extract_events(chapter_text)\n\n                subtopic_data\
          \ = {\n                    \"subtopic_title\": subtopic_title,\n       \
          \             \"content_index\": content_index,\n                    \"\
          character_relationships\": chapter_relationships,  # 使用章节级关系\n         \
          \           \"golden_quotes\": golden_quotes,\n                    \"events\"\
          : events\n                }\n                subtopics.append(subtopic_data)\n\
          \        return subtopics\n\n    for i, match in enumerate(subtopic_matches):\n\
          \        if i < len(subtopic_titles) and subtopic_titles[i].strip():\n \
          \           current_subtopic_title = subtopic_titles[i]\n        else:\n\
          \            parsed_title = match.group(1).strip()\n            current_subtopic_title\
          \ = parsed_title if parsed_title else f\"子主题{i+1}\"\n        \n        subtopic_start\
          \ = match.start()\n        if i + 1 < len(subtopic_matches):\n         \
          \   subtopic_end = subtopic_matches[i + 1].start()\n        else:\n    \
          \        subtopic_end = len(chapter_text)\n\n        subtopic_content =\
          \ chapter_text[subtopic_start:subtopic_end]\n\n        content_index = extract_content_index(subtopic_content,\
          \ title, current_subtopic_title)\n        golden_quotes = extract_golden_quotes(subtopic_content)\n\
          \        events = extract_events(subtopic_content)\n\n        subtopic_data\
          \ = {\n            \"subtopic_title\": current_subtopic_title,\n       \
          \     \"content_index\": content_index,\n            \"character_relationships\"\
          : chapter_relationships,  # 使用章节级关系\n            \"golden_quotes\": golden_quotes,\n\
          \            \"events\": events\n        }\n\n        subtopics.append(subtopic_data)\n\
          \n    return subtopics\n\n\ndef extract_content_index(text: str, title:\
          \ str, sectionTitle: str) -> str:\n    \"\"\"提取内容索引\"\"\"\n    return f\"\
          章节：{title} 子主题：{sectionTitle}\"\n\n\ndef extract_golden_quotes(text: str)\
          \ -> List[str]:\n    \"\"\"提取金句\"\"\"\n    golden_quotes = []\n    quote_section_match\
          \ = re.search(r'### 金句\\n(.*?)(?=### |## |$)', text, re.DOTALL)\n    if\
          \ not quote_section_match:\n        return golden_quotes\n\n    quote_section\
          \ = quote_section_match.group(1)\n    quote_pattern = r'^- (.+)$'\n    quote_matches\
          \ = re.findall(quote_pattern, quote_section, re.MULTILINE)\n\n    for quote\
          \ in quote_matches:\n        golden_quotes.append(quote.strip())\n\n   \
          \ return golden_quotes\n\n\ndef extract_events(text: str) -> List[Dict[str,\
          \ Any]]:\n    \"\"\"提取事件\"\"\"\n    events = []\n\n    # 匹配所有事件块\n    event_pattern\
          \ = r'### 事件\\d+：([^\\n]+)\\n(.*?)(?=### 事件|### |## |$)'\n    event_matches\
          \ = re.findall(event_pattern, text, re.DOTALL)\n\n    for event_title, event_content\
          \ in event_matches:\n        # 提取事件背景\n        background_match = re.search(\n\
          \            r'\\*\\*事件背景：\\*\\*\\s*(.*?)(?=\\n\\*\\*事件经过：\\*\\*|$)',\n\
          \            event_content, \n            re.DOTALL\n        )\n       \
          \ background = background_match.group(1).strip() if background_match else\
          \ \"\"\n\n        # 提取事件经过\n        process_match = re.search(\n       \
          \     r'\\*\\*事件经过：\\*\\*\\s*(.*?)(?=\\n\\*\\*事件影响：\\*\\*|$)',\n       \
          \     event_content, \n            re.DOTALL\n        )\n        process\
          \ = []\n        if process_match:\n            process_text = process_match.group(1).strip()\n\
          \            process_items = re.findall(r'- (.*?)(?=\\n- |$)', process_text,\
          \ re.DOTALL)\n            process = [item.strip() for item in process_items]\n\
          \n        # 提取事件影响\n        impact_match = re.search(\n            r'\\\
          *\\*事件影响：\\*\\*\\s*(.*?)(?=\\n\\n|### |## |$)',\n            event_content,\
          \ \n            re.DOTALL\n        )\n        impact = []\n        if impact_match:\n\
          \            impact_text = impact_match.group(1).strip()\n            if\
          \ re.search(r'^- ', impact_text, re.MULTILINE):\n                impact_items\
          \ = re.findall(r'- (.*?)(?=\\n- |$)', impact_text, re.DOTALL)\n        \
          \        impact = [item.strip() for item in impact_items]\n            else:\n\
          \                impact = [impact_text]\n\n        events.append({\n   \
          \         \"event_title\": event_title.strip(),\n            \"event_background\"\
          : background,\n            \"event_process\": process,\n            \"event_impact\"\
          : impact\n        })\n\n    return events\n\n"
