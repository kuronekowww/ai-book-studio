    - data:
        code: "import re\n\n\ndef extract_content(content):\n    # 找到\"# 目录\"和\"#\
          \ 正文\"的位置\n    start_marker = \"# 目录\"\n    end_marker = \"# 正文\"\n\n  \
          \  start_index = content.find(start_marker)\n    end_index = content.find(end_marker)\n\
          \n    if start_index == -1 or end_index == -1:\n        return \"未找到指定的标记\"\
          \n\n    # 提取两个标记之间的内容\n    extracted_content = content[start_index:end_index].strip()\n\
          \    return extracted_content\n\n\ndef find_section_titles(content, chapter_title):\n\
          \    section_titles = []\n\n    # 查找章节标题所在行\n    lines = content.split('\\\
          n')\n    chapter_pattern = re.compile(r'^#{1,6}\\s+' + re.escape(chapter_title)\
          \ + r'$')\n\n    chapter_index = -1\n    chapter_level = 0\n\n    # 找到章节标题及其级别\n\
          \    for i, line in enumerate(lines):\n        match = chapter_pattern.match(line.strip())\n\
          \        if match:\n            chapter_index = i\n            chapter_level\
          \ = len(re.match(r'^(#+)', line.strip()).group(1))\n            break\n\n\
          \    # 如果找不到章节标题，返回空列表\n    if chapter_index == -1:\n        return section_titles\n\
          \n    # 从章节标题后开始收集子标题，直到遇到同级或更高级的标题\n    i = chapter_index + 1\n    while\
          \ i < len(lines):\n        line = lines[i].strip()\n        if line and\
          \ line.startswith('#'):\n            # 获取当前行的标题级别\n            current_level\
          \ = len(re.match(r'^(#+)', line).group(1))\n\n            # 如果遇到同级或更高级的标题，停止收集\n\
          \            if current_level <= chapter_level:\n                break\n\
          \n            # 提取标题文本（去掉#号和前后空格）\n            title_text = re.sub(r'^#+\\\
          s+', '', line)\n            section_titles.append(title_text)\n\n      \
          \  i += 1\n\n    return section_titles\n\n\ndef main(http_content, chapter_title=None):\n\
          \    content = extract_content(http_content)\n    return {\n        'sectionTitles':\
          \ find_section_titles(content, chapter_title)\n    }"
